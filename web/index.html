    <meta charset="UTF-8" />

    <meta name="mobile-web-app-capable" content="yes" />

    <title>OrbitX City — Free Realistic City Game in Your Browser</title>
    <style>
      /* Boot splash (realistic overhaul): the style-video splash frame
       * fills the screen before React mounts — the first thing the
       * player sees, not a black page. The app canvas/menu cover it
       * once they paint. */
      html,
      body {
        background: #020611;
      }
      body {
        background-image: url("/splash-hero.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>

    <div id="root"></div>
