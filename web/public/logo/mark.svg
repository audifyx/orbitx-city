<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="OrbitX City mark">
  <!-- OrbitX City mark: two crossing skyscraper towers form an X inside a gold orbit ring, skyline at the base. Black / gold / white only. -->
  <rect width="200" height="200" fill="#000000"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#e0b33a" stroke-width="6"/>
  <polygon points="48,162 66,178 152,38 134,22" fill="#e0b33a"/>
  <polygon points="152,162 134,178 48,38 66,22" fill="#f2c94c"/>
  <g fill="#e0b33a">
    <rect x="84" y="170" width="6" height="12"/>
    <rect x="91" y="162" width="6" height="20"/>
    <rect x="98" y="172" width="6" height="10"/>
    <rect x="105" y="158" width="6" height="24"/>
    <rect x="112" y="166" width="6" height="16"/>
  </g>
</svg>
