# OrbitX City — Render Blueprint.
#
# The game itself is hosted on Cloudflare Pages (free static hosting, no
# bandwidth cap). This blueprint creates the API side on Render: a
# persistent Node server (server.mjs) that serves the same api/city.js
# handlers Vercel served. Render's free web service does not count
# requests, so the City's 250ms /api/city polling cannot pause the game
# the way Vercel's per-request billing did.
#
# The static-site service below is a FALLBACK static host (same build as
# Pages). It is harmless to keep: if Pages is used, the Render static
# site simply sits unused. Its build needs VITE_API_URL set in the
# dashboard to the API service URL (see docs/RENDER_CLOUDFLARE_MIGRATION.md).
#
# No secret VALUES are in this file — every secret is `sync: false`,
# which means "set it in the Render dashboard". The values must be copied
# from the Vercel project env (same key names) — see the migration doc
# for the full inventory. WALLET_MASTER_KEY's value exists only in
# Vercel; if it cannot be recovered there, the user must re-enter it
# (rotating it would orphan already-sealed in-app wallet keys).

services:
  - type: web
    name: orbitx-city-api
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase (blue-chair). The code also accepts the STORAGE_* aliases
      # Vercel's Marketplace integration injects — set the SUPABASE_* names
      # here; the STORAGE_* names are optional duplicates.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Neon Postgres (used for player saves when set; optional — the
      # server falls back to Supabase, then in-memory).
      - key: DATABASE_URL
        sync: false
      # Upstash Redis (presence/rate-limit cache; optional).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # LiveKit voice.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Solana / ORBITX.
      - key: ORBITX_MINT
        sync: false
      - key: SOLANA_NETWORK
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUP_API_KEY
        sync: false
      # In-app wallet sealing. VALUE EXISTS ONLY IN VERCEL — see doc.
      - key: WALLET_MASTER_KEY
        sync: false
      # Mock-auth signer (dev fallback only; Supabase mode ignores it).
      - key: ORBITX_AUTH_SECRET
        sync: false
      # Price pins / admin lists (optional; code has defaults).
      - key: SOL_USD
        sync: false
      - key: ORBITX_USD
        sync: false
      - key: AD_ADMINS
        sync: false
      - key: AD_DENYLIST
        sync: false
      - key: ARCADE_PAPER
        sync: false
      # CORS: comma-separated extra origins allowed to call the API
      # (the Pages origin is allowed by default). Set this if the game
      # later moves to a custom domain.
      - key: API_CORS_ORIGINS
        sync: false

  - type: web
    name: orbitx-city
    env: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: web/dist
    envVars:
      # Build-time: where the game calls the API. For the Render static
      # fallback, set this to the API service URL after it exists
      # (https://orbitx-city-api.onrender.com). Pages sets the same var
      # in its own dashboard instead.
      - key: VITE_API_URL
        sync: false
